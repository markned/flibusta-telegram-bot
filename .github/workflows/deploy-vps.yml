name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Oracle
    steps:
      - name: Pull and restart bot on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd '${{ secrets.VPS_DEPLOY_PATH }}'
            git fetch origin
            git reset --hard origin/main
            python3 deploy/normalize_env.py .env
            .venv/bin/pip install -r requirements.txt
            export SYSTEMD_PAGER=cat
            sudo -n /usr/bin/systemctl restart flibusta-tg-bot
            sudo -n /usr/bin/systemctl status flibusta-tg-bot
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 2 http://127.0.0.1:8081/health >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Web health check did not become ready in time" >&2
                exit 1
              fi
              sleep 2
            done
